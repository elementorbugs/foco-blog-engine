name: App Directory Refresh

# Keeps the tabbed app directory on /best-adhd-app/ in sync with published posts.
# Picks up app posts published by hand in wp-admin (vs / alternative / review posts filed under
# "App Reviews & Comparisons"). Independent of the paused daily article generator.
on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild directory
        run: node rebuild-app-directory.js --discover --live
        env:
          WP_HOST: ${{ secrets.WP_HOST }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
