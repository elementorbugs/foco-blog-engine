name: Blog Post Pipeline

# Runs create-post.js from anywhere, using the WordPress credentials stored as GitHub secrets.
# Built for cloud sessions, which have no .env on disk. Usage is documented in CLAUDE.md.
# Default action is "draft": nothing goes live unless action=publish is chosen explicitly.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'dry-run, draft, publish, patch (edits from post-patches/<slug>.json), fetch (saves a live post or draft into the repo), seo-title (sets the RankMath SEO title from the title input and/or the focus keyword from the keyword input), or delete-draft (drafts only)'
        type: choice
        required: true
        default: draft
        options: [dry-run, draft, publish, patch, fetch, seo-title, delete-draft]
      file:
        description: 'Post file, e.g. posts-new/post-my-slug.html'
        type: string
        required: true
      keyword:
        description: 'Primary keyword (required unless delete-draft)'
        type: string
        default: ''
      title:
        description: 'WP title, max 58 characters (needed when the H1 is longer)'
        type: string
        default: ''
      cover_title:
        description: 'Cover title, lines separated by a literal \n'
        type: string
        default: ''
      directory:
        description: 'App directory category, or none'
        type: string
        default: ''
      pillar:
        description: 'Pillar post'
        type: boolean
        default: false
      howto:
        description: 'Procedural post (HowTo schema)'
        type: boolean
        default: false
      skip_cover:
        description: 'Keep the existing cover'
        type: boolean
        default: false
      skip_pexels:
        description: 'Skip Pexels images'
        type: boolean
        default: false
      use_local:
        description: 'Full rewrite: the file replaces the content of an existing post'
        type: boolean
        default: false

permissions:
  contents: write

# One job at a time, so two runs never race on the same post or on app-directory.json.
concurrency:
  group: blog-post-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACTION: ${{ inputs.action }}
      POST_FILE: ${{ inputs.file }}
      KEYWORD: ${{ inputs.keyword }}
      TITLE: ${{ inputs.title }}
      COVER_TITLE: ${{ inputs.cover_title }}
      DIRECTORY: ${{ inputs.directory }}
      PILLAR: ${{ inputs.pillar }}
      HOWTO: ${{ inputs.howto }}
      SKIP_COVER: ${{ inputs.skip_cover }}
      SKIP_PEXELS: ${{ inputs.skip_pexels }}
      USE_LOCAL: ${{ inputs.use_local }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check inputs
        run: |
          if ! [[ "$POST_FILE" =~ ^posts-new/post-[a-z0-9-]+\.html$ ]]; then
            echo "::error::file must look like posts-new/post-my-slug.html"
            exit 1
          fi
          if [ "$ACTION" != "delete-draft" ] && [ "$ACTION" != "patch" ] && [ "$ACTION" != "fetch" ] && [ "$ACTION" != "seo-title" ] && [ -z "$KEYWORD" ]; then
            echo "::error::keyword is required for $ACTION"
            exit 1
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --silent

      - name: Install Playwright Chromium (cover generation)
        if: inputs.action == 'draft' || inputs.action == 'publish'
        run: npx playwright install chromium --with-deps

      # create-post.js only reads credentials from files. Both files are gitignored
      # and vanish with the runner.
      - name: Write credential files
        env:
          WP_HOST: ${{ secrets.WP_HOST }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          umask 077
          printf 'WP_HOST=%s\nWP_USER=%s\nWP_APP_PASSWORD=%s\n' "$WP_HOST" "$WP_USER" "$WP_APP_PASSWORD" > .env
          if [ -n "$PEXELS_KEY" ]; then printf '%s' "$PEXELS_KEY" > .pexels-key; fi

      # {{media:<file>}} placeholders point at post-media/<slug>/<file>.
      - name: Upload post images
        if: inputs.action == 'draft' || inputs.action == 'publish'
        run: node scripts/upload-post-media.js "$POST_FILE"

      - name: Run pipeline
        if: inputs.action == 'dry-run' || inputs.action == 'draft' || inputs.action == 'publish'
        run: |
          args=("$POST_FILE" "--keyword=$KEYWORD")
          [ -n "$TITLE" ]       && args+=("--title=$TITLE")
          [ -n "$COVER_TITLE" ] && args+=("--cover-title=$COVER_TITLE")
          [ -n "$DIRECTORY" ]   && args+=("--directory=$DIRECTORY")
          [ "$PILLAR" = "true" ]      && args+=("--pillar")
          [ "$HOWTO" = "true" ]       && args+=("--howto")
          [ "$SKIP_COVER" = "true" ]  && args+=("--skip-cover")
          [ "$SKIP_PEXELS" = "true" ] && args+=("--skip-pexels")
          [ "$USE_LOCAL" = "true" ]   && args+=("--use-local")
          [ "$ACTION" = "dry-run" ]   && args+=("--dry-run")
          [ "$ACTION" = "publish" ]   && args+=("--publish")
          node create-post.js "${args[@]}"

      - name: Patch existing post
        if: inputs.action == 'patch'
        run: |
          slug="$(basename "$POST_FILE" .html)"
          pf="post-patches/${slug#post-}.json"
          # {{media:<file>}} in a patch: upload post-media/<slug>/<file> and swap in the URL first.
          if grep -q '{{media' "$pf"; then
            cp "$pf" "/tmp/${slug}.html"
            node scripts/upload-post-media.js "/tmp/${slug}.html"
            cp "/tmp/${slug}.html" "$pf"
          fi
          node scripts/patch-post.js "${slug#post-}"

      - name: Check the result in WordPress
        if: inputs.action == 'draft' || inputs.action == 'publish' || inputs.action == 'patch'
        run: |
          slug="$(basename "$POST_FILE" .html)"
          # A batch patch file (an object keyed by slug) has no single post to check.
          if [ "$ACTION" = "patch" ] && node -e "process.exit(Array.isArray(require('./post-patches/${slug#post-}.json')) ? 1 : 0)"; then
            echo "Batch patch: skipping the single-post check."; exit 0
          fi
          node scripts/check-post.js "${slug#post-}"

      - name: Fetch post into the repo
        if: inputs.action == 'fetch'
        run: |
          slug="$(basename "$POST_FILE" .html)"
          node scripts/fetch-post.js "${slug#post-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts-new post-meta
          git diff --cached --quiet && { echo "Nothing new to save"; exit 0; }
          git commit -m "Fetch ${slug#post-} from WordPress"
          git push

      - name: Set RankMath SEO title
        if: inputs.action == 'seo-title'
        run: |
          if [ -z "$TITLE" ] && [ -z "$KEYWORD" ]; then echo "::error::seo-title needs a title or a keyword"; exit 1; fi
          slug="$(basename "$POST_FILE" .html)"
          node scripts/set-seo-title.js "${slug#post-}" "$TITLE" "$KEYWORD"

      - name: Delete draft
        if: inputs.action == 'delete-draft'
        run: |
          slug="$(basename "$POST_FILE" .html)"
          node scripts/delete-draft.js "${slug#post-}"

      - name: Save app directory changes
        if: inputs.action == 'draft' || inputs.action == 'publish'
        run: |
          if git diff --quiet -- app-directory.json; then
            echo "app-directory.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-directory.json
          git commit -m "App directory: card for $(basename "$POST_FILE" .html)"
          git push
